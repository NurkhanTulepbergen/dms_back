name: Deploy Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-backend-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_BRANCH: main
      DEPLOY_BACKEND_DIR: ${{ secrets.DEPLOY_BACKEND_DIR }}
      DEPLOY_COMPOSE_FILE: ${{ secrets.DEPLOY_COMPOSE_FILE }}
      DEPLOY_COMPOSE_DIR: ${{ secrets.DEPLOY_COMPOSE_DIR }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_ROOT: ${{ secrets.DEPLOY_ROOT }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - name: Validate deploy settings
        run: |
          set -eu

          for var in DEPLOY_HOST DEPLOY_ROOT DEPLOY_SSH_KEY DEPLOY_USER; do
            if [ -z "$(eval "printf '%s' \"\${$var:-}\"")" ]; then
              echo "$var is not set"
              exit 1
            fi
          done

      - name: Configure SSH
        run: |
          set -eu

          SSH_HOST="$(printf '%s' "$DEPLOY_HOST" | tr -d '[:space:]')"
          SSH_PORT="$(printf '%s' "${DEPLOY_PORT:-22}" | tr -d '[:space:]')"
          SSH_PORT="${SSH_PORT:-22}"
          if [ -z "$SSH_HOST" ]; then
            echo "DEPLOY_HOST is empty after trimming whitespace."
            exit 1
          fi

          if ! printf '%s' "$SSH_PORT" | grep -Eq '^[0-9]+$'; then
            echo "DEPLOY_PORT must be a number. Current value is invalid."
            exit 1
          fi
          printf 'DEPLOY_HOST=%s\n' "$SSH_HOST" >> "$GITHUB_ENV"
          printf 'DEPLOY_PORT=%s\n' "$SSH_PORT" >> "$GITHUB_ENV"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          touch ~/.ssh/known_hosts
          if ! ssh-keyscan -T 30 -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts; then
            echo "Could not read SSH host key. Check DEPLOY_HOST, DEPLOY_PORT, firewall, and SSH service."
            exit 1
          fi

      - name: Deploy backend on server
        run: |
          set -eu

          ssh -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "DEPLOY_BACKEND_DIR='${DEPLOY_BACKEND_DIR}' DEPLOY_BRANCH='${DEPLOY_BRANCH}' DEPLOY_COMPOSE_DIR='${DEPLOY_COMPOSE_DIR}' DEPLOY_COMPOSE_FILE='${DEPLOY_COMPOSE_FILE}' DEPLOY_ROOT='${DEPLOY_ROOT}' /bin/sh -s" <<'EOF'
          set -eu

          DEPLOY_ROOT=${DEPLOY_ROOT%/}
          BACKEND_DIR=${DEPLOY_BACKEND_DIR:-dms_back}
          COMPOSE_DIR=${DEPLOY_COMPOSE_DIR:-$BACKEND_DIR/deploy}
          COMPOSE_FILE=${DEPLOY_COMPOSE_FILE:-docker-compose.yml}

          if docker compose version >/dev/null 2>&1; then
            COMPOSE_BIN="docker compose"
          else
            COMPOSE_BIN="docker-compose"
          fi

          cd "$DEPLOY_ROOT/$BACKEND_DIR"
          git fetch origin "$DEPLOY_BRANCH"
          git checkout "$DEPLOY_BRANCH"
          git pull --ff-only origin "$DEPLOY_BRANCH"

          cd "$DEPLOY_ROOT/$COMPOSE_DIR"
          $COMPOSE_BIN -f "$COMPOSE_FILE" build backend
          $COMPOSE_BIN -f "$COMPOSE_FILE" rm -f -s backend >/dev/null 2>&1 || true
          docker rm -f dms_backend >/dev/null 2>&1 || true
          docker ps -aq --filter "name=_dms_backend$" | xargs -r docker rm -f >/dev/null 2>&1 || true
          $COMPOSE_BIN -f "$COMPOSE_FILE" up -d --no-deps backend
          docker restart dms_nginx >/dev/null 2>&1 || true
          EOF
