version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dms_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    # MySQL больше не нужен
    depends_on: []

  nginx:
    image: nginx:alpine
    container_name: dms_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - app
